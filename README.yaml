description: |-
  Terraform module for managing OpenAI project service accounts and organization admin API keys
  through the [cloudopsworks/openai](https://registry.terraform.io/providers/cloudopsworks/openai/latest)
  provider. It stores structured credentials in AWS Secrets Manager and optionally schedules
  module-wide Lambda rotation for project service-account keys and organization admin keys.
  Terraform retains service-account identity; the Lambda owns enrolled key rotation.

# Introduction to the project
introduction: |-
  ## Overview

  This module manages OpenAI credential infrastructure on AWS:

  1. **Project service accounts** — creates an `openai_service_account` for each configured
     service account inside a project. OpenAI provisions an API key during service-account
     creation only when rotation is off; Terraform stores that key in AWS Secrets Manager.
     With rotation, the provider creates the account without a key and the Lambda creates
     every key, including the first. Each account has a project `role` (`member` or `owner`)
     and optional key `scopes`.

  2. **Organization admin keys** — creates Terraform-managed `openai_admin_api_key`
     resources when rotation is off. When enrolled, the Lambda creates admin keys
     instead. Both modes support relative expiry in seconds, hours, or days.

  3. **AWS Secrets Manager** — every active key is persisted as structured JSON containing
     its value, ID, name, and applicable project/service-account identity. Plain-string
     secrets are rejected. Terraform writes nonrotating versions; a configured Lambda writes
     rotating `AWSPENDING` and `AWSCURRENT` versions.

  4. **Optional rotation** — `settings.rotation_lambda` selects one Lambda by function name
     or ARN for every enrolled key. The default schedule is every 30 days with
     the AWS default window starting at 00:00 UTC. `secret.rotation_enabled = false` opts an
     individual key out when necessary, but is **not recommended**. Without a Lambda, all
     keys remain Terraform-owned and no rotation schedules are created.

  > **Provider version:** rotating project keys require `cloudopsworks/openai` `>= 0.2.1`
  > for identity-only service-account creation. Publish that provider version and deploy
  > a Lambda supporting keyless project bootstrap **before** applying this module change.
  > Releases prior to `v2.0.0` targeted the `mkdev-me/openai` provider and the
  > `openai_project_service_account` resource — see [Breaking changes in v2.0.0](#breaking-changes-in-v200).

  ### Rotation schedule and window

  Set `settings.rotation_period_days` for a whole-day rate, or override it with an
  AWS `settings.rotation_cron_expression` such as `cron(0 3 1 * ? *)` (03:00 UTC
  on the first of each month). Cron must use minute zero and a single numeric
  UTC hour. Set `settings.rotation_window_hours` (1–23) to control the window
  length. Omit it or set it to null to use the AWS default; for day-based
  schedules the default window ends at the end of the UTC day. An explicit
  window must end by 24:00 UTC. AWS can start rotation at any point inside the
  window. Set a shorter duration if you need predictable hours for decommissioning.

  Rate schedules support 1–999 days. The legacy 1000-day AWS schedule is kept
  only when no cron or explicit window is set. Keep intervals within the OpenAI
  key lifetime limit. With cron,
  every enrolled key needs an explicit expiry because the Lambda cannot derive
  a lifetime from cron. Set `expires_in_seconds` for project keys and one of
  the relative expiry fields for admin keys. Allow for the longest gap between
  rotations plus the window and an operational buffer. Review the schedule
  change as a live rotation change: applying the association can trigger a
  rotation outside the scheduled window.

  ### Naming convention

  Both the OpenAI resource name and the corresponding Secrets Manager secret name support
  two modes, configurable per entry:

  | Mode | Value used |
  |------|-----------|
  | `name_prefix` | `<name_prefix>-<system_name>` where `system_name` encodes org unit, environment name, environment type, spoke, and region |
  | `name` | fixed string, used verbatim |

  Secrets Manager secret paths default to:

  - project service accounts: `/<org_unit>/<env_name>/<env_type>/<project_key>`
  - admin keys: `/<org_unit>/<env_name>/<env_type>/admin`

  Both defaults can be overridden per entry with `secret.path`. For admin keys, the
  `/admin` segment is added only when `secret.path` is omitted; an explicit `secret.path`
  is used as the full parent path for the final secret name.

  ### Secret structure

  Every usable credential version, rotating or not, is a JSON object with these six fields:

  ```json
  {
    "key_type": "project",
    "api_key": "sk-...",
    "api_key_id": "key_...",
    "name": "actual-key-name",
    "project_id": "proj_...",
    "service_account_id": "svc_..."
  }
  ```

  For an admin key, `key_type` is `"admin"`; `project_id` and
  `service_account_id` are JSON `null`, while `api_key_id` is the real admin-key ID.
  `secret.plain = true` is invalid even without rotation; migrate legacy consumers
  to JSON parsing. Terraform state and Secrets Manager versions both contain
  sensitive key material. Do not print secret values or include them in outputs.

  | Stage | Owner | Purpose |
  |-------|-------|---------|
  | `AWSCURRENT` | Terraform initially; Lambda after enrollment/first rotation | Active six-field credential JSON, except the first-create marker before rotation. |
  | `TFBOOTSTRAP` | Terraform, rotating keys only | Initial marker with `api_key = null` and `api_key_id = "__CREATE_NEW__"`. Project markers also include key type, name, project ID, and service-account ID; admin markers contain only the two marker fields. The Lambda creates the first key. Existing bootstrap versions are not rewritten. |
  | `TFCONFIG` | Terraform, rotating keys only | Creation parameters, not a usable credential. |
  | `AWSPENDING` | Lambda | Candidate version written with the rotation event token before promotion. |

  A rotating secret has a separately versioned `TFCONFIG` payload:

  ```json
  {
    "schema_version": 1,
    "key_type": "project",
    "name": "resolved-key-name",
    "project_id": "proj_...",
    "service_account_id": "svc_...",
    "scopes": ["api.model.request"],
    "role": "member",
    "expires_in_seconds": null
  }
  ```

  For admin keys, `key_type` is `"admin"`, `project_id`, `service_account_id`,
  `scopes`, and `role` are `null`, and `expires_in_seconds` is the configured
  relative expiry normalized from seconds, hours, or days. For project keys,
  `expires_in_seconds` is the optional relative TTL configured on the service
  account. For both rotating key types, null derives a finite expiry from the
  rate schedule. `scopes = null` means the module has
  not requested a restriction; do **not** interpret an empty scope list as no
  permissions. Read `TFCONFIG` by staging label, not by default `AWSCURRENT`.

  ### Service account scopes

  The Terraform provider treats `scopes` on `openai_service_account` as
  **replace-only**. With rotation off, changing them replaces the service account,
  its key, and the stored secret version. With rotation on, the provider creates
  no key, and scopes flow only through `TFCONFIG` to the Lambda; existing account
  scope state is ignored to avoid replacement during migration. Terraform still owns
  service-account `project_id`, name, and role, so replacing that identity can
  invalidate an active key and requires a coordinated rotation. The deprecated
  bootstrap-key-ID output is null for new rotating accounts; historical state
  may still contain IDs that are not active.

  ### Admin key expiry

  Admin key expiry is expressed as a **relative** duration, not an absolute timestamp.
  At most one of `expires_in_seconds`, `expire_in_hours` or `expire_in_days` may be set;
  omitting all three creates a non-expiring key. Values must resolve to a whole
  number of seconds from 1 through 31,536,000 (one year). Without rotation,
  changing expiry replaces the Terraform-owned key. With rotation, Terraform
  updates `TFCONFIG`, and each Lambda-created replacement gets a fresh relative
  TTL. Configure TTL comfortably beyond the rotation interval and retry window.

  ### Rotation ownership and migration

  The module **configures** rotation but does not deploy the Lambda or grant its
  permissions. Supply an existing Lambda name or ARN. Give it an independently
  managed OpenAI admin credential bound to the intended OpenAI organization,
  least-privilege access to the enrolled secret
  ARNs, permission to read `TFCONFIG` and write/promote candidate versions, and
  permission to create, inspect, and retire the applicable OpenAI keys. Do not
  make it depend on the key it is rotating to manage itself. `TFCONFIG` does
  not carry an organization ID; configure and verify that organization boundary
  in the Lambda deployment rather than inferring it from a secret name. Test a
  nonproduction secret before enrolling production consumers.

  **Rollout order:** deploy the Lambda version that accepts both legacy real
  project bootstrap credentials and new six-field keyless project markers;
  publish the provider with `create_api_key = false`; then upgrade this module.
  This is an additive, minor-version migration, not a reason to replace a
  service account or regenerate its active key. Verify the Lambda's management
  secret contains both `api_key` and the matching `organization_id`, its IAM
  policy covers target secret ARNs, and a nonproduction rotation reaches
  `AWSCURRENT` before enrolling consumers. The module's mock tests cannot prove
  that a deployed Lambda works.

  For each **existing** service account being enrolled, preserve the account and
  its current secret version by moving their Terraform addresses before applying:

  ```sh
  terragrunt state mv 'openai_service_account.this["my-project/worker"]' \
    'openai_service_account.rotating["my-project/worker"]'
  terragrunt state mv 'aws_secretsmanager_secret_version.this["my-project/worker"]' \
    'aws_secretsmanager_secret_version.rotation_bootstrap["my-project/worker"]'
  ```

  Review the subsequent plan: the same account ID and current credential must
  remain, with no remote account/key deletion and no `AWSCURRENT` overwrite.
  The provider relinquishes bootstrap-key state when `create_api_key` becomes
  false; historical state snapshots and the prior `TFBOOTSTRAP` version may
  still contain the old credential. Securely retire/purge them under your
  state and Secrets Manager retention policy, not by deleting the live account.

  For each **existing** admin key being enrolled, record its current key ID and
  securely read its active value first. Detach the key resource from state (do
  **not** destroy the remote key) and move only the existing version's state:

  ```sh
  terragrunt state rm 'openai_admin_api_key.this["terraform-provisioner"]'
  terragrunt state mv 'aws_secretsmanager_secret_version.admin_key["terraform-provisioner"]' \
    'aws_secretsmanager_secret_version.admin_rotation_bootstrap["terraform-provisioner"]'
  ```

  Legacy active versions may contain only `{"api_key":"..."}` or a plain string.
  Before starting rotation, securely backfill **a new AWSCURRENT version** with the
  six-field JSON contract, including the real `api_key_id`, name, and relevant
  project/service-account IDs; never place the plaintext in shell history or logs.
  Capture the admin ID before `state rm`; a legacy service-account bootstrap ID
  may be available in historical Terraform state. A
  backfill must not erase the old version or move `TFCONFIG`. Review `terragrunt
  plan` to confirm no old OpenAI key or service account is destroyed, no existing
  active version is replaced, and only configuration/schedules are added.

  On a new project or admin secret the initial `AWSCURRENT` marker is **not** a
  usable credential until the Lambda completes its first rotation; gate consumers
  on success. Older admin bootstrap versions may have a six-field marker that
  the Lambda rejects; because Terraform ignores changes to bootstrap values,
  upgrading this module alone will not repair those versions. Coordinate a new
  two-field marker version and label it `TFBOOTSTRAP`/`AWSCURRENT` only after
  confirming no active credential would be displaced. Existing version states
  moved to bootstrap addresses may lack a
  `TFBOOTSTRAP` label; the Lambda must use `AWSCURRENT` and `TFCONFIG`, not require
  that historical label. Terraform may briefly leave `TFCONFIG` unavailable
  while replacing its version after a setting change. Retry that read; never
  use stale/default creation settings or overwrite `AWSCURRENT`. A `project_id`
  change can replace the Terraform-owned service-account identity and invalidate
  the active key. Name and role update in place, but role changes can immediately
  alter effective key permissions; test consumer access and coordinate rotation.
  For identity replacement, prefer a **new logical service-account entry** and
  tested consumer cutover; otherwise use a deliberate recovery plan for the old
  key and secret. Do not treat identity replacement as ordinary rotation.

  **Turning rotation off is a separate migration, not a safe flag toggle.** For
  a project service account, move its identity state from
  `openai_service_account.rotating["project/account"]` back to
  `openai_service_account.this["project/account"]` only as part of a planned
  cutover, before applying the flag change:

  ```sh
  terragrunt state mv 'openai_service_account.rotating["my-project/worker"]' \
    'openai_service_account.this["my-project/worker"]'
  ```

  The provider's key value/ID in state is historical after rotation;
  moving the account or old bootstrap-version state back does **not** make the
  Lambda's current key Terraform-managed. Establish a fresh Terraform-owned
  credential (normally through a new logical service-account entry and consumer
  cutover), verify it, then retire the Lambda-owned key and schedule. If that
  cannot be done without replacing the account, keep rotation enabled until
  the replacement/cutover is approved and tested.

  For an admin key, disabling enrollment causes Terraform to create a **new**
  admin key and version, not to import the Lambda's existing plaintext key.
  Plan a staged cutover: ensure the independent management credential remains
  available, verify the proposed new key and secret version, switch consumers,
  then retire the previous Lambda-owned admin key and schedule. Never blindly
  toggle `rotation_lambda` or `rotation_enabled` to null/false and apply across
  all entries at once; inspect each key's plan and preserve a rollback path.

  **Decommissioning a rotating key is also coordinated work.** Removing an
  enrolled admin entry or AWS secret does not revoke the Lambda-owned OpenAI
  key: Terraform has no admin-key resource for that entry. Decommission outside
  the configured rotation window, with no rotation in flight or manually
  triggered during teardown. Move consumers to a replacement and use the independent management credential
  to revoke the active key plus any pending or orphan keys. Verify that revocation
  and consumer cutover before removing the secret and `TFCONFIG`. For project
  keys, decide explicitly whether the service-account identity is also being
  retired; do not assume deleting a secret cleans up all its OpenAI keys.

  ### Breaking changes in v2.0.0

  | Area | `v1.x` (`mkdev-me/openai`) | `v2.0.0` (`cloudopsworks/openai`) |
  |------|----------------------------|-----------------------------------|
  | Provider source | `mkdev-me/openai` | `cloudopsworks/openai` `~> 0.1` |
  | Service account resource | `openai_project_service_account` | `openai_service_account` |
  | Service account role | not supported | `role` — `member` (default) or `owner` |
  | Service account scopes | not supported | `scopes` — create-only set of API scopes |
  | Admin key scopes | `scopes` list | **removed** — the provider does not expose scopes on admin keys |
  | Admin key expiry | `expires_at` (absolute Unix timestamp) | `expires_in_seconds` / `expire_in_hours` / `expire_in_days` (relative, mutually exclusive) |
  | Provider credentials | `OPENAI_ADMIN_KEY` environment variable | `admin_api_key`, `OPENAI_ADMIN_KEY`, or a cloud secret source (`aws_secrets_manager`, `gcp_secret_manager`, `azure_key_vault`) |

  Upgrading from `v1.x` requires removing `scopes` and `expires_at` from every
  `settings.admin_keys` entry and re-creating existing service accounts, since the underlying
  resource type changed.

# How to use this project
usage: |-
  ### 1. Scaffold a deployment

  This module ships a Terragrunt [scaffold](https://docs.terragrunt.com/reference/cli/commands/scaffold)
  template under `.boilerplate/`. Scaffold writes into the **current** directory, so create and
  enter the target directory first — never pass `--working-dir`.

  ```sh
  # 1. Create and enter the target deployment directory
  mkdir -p production/us-east-1/001/openai-api-keys
  cd production/us-east-1/001/openai-api-keys

  # 2. Scaffold the module (do NOT use --working-dir)
  terragrunt scaffold github.com/cloudopsworks/terraform-module-openai-mgmt-api-keys

  # 3. Edit inputs.yaml with deployment-specific values
  #    (all keys and comments are pre-populated from .boilerplate/inputs.yaml)
  vi inputs.yaml

  # 4. Apply
  terragrunt apply
  ```

  ### 2. Generated `inputs.yaml`

  Scaffolding produces the annotated `inputs.yaml` below. Every key mirrors
  `.boilerplate/inputs.yaml`; uncomment and fill in what the deployment needs.

  ```yaml
  # Module configuration
  # settings:                             # (Optional) Settings for OpenAI API key management. Default: {}
  #   rotation_lambda: "rotate-openai"    # (Optional) Module-wide Lambda function name or ARN. Default: null (rotation disabled)
  #   rotation_period_days: 30            # (Optional) Whole days, 1-999 for rate; 1000 only with no explicit window. Default: 30
  #   rotation_window_hours: 1            # (Optional) Rotation window in whole hours, 1-23. Default: null (AWS default)
  #   rotation_cron_expression: "cron(0 3 1 * ? *)" # (Optional) AWS cron with one UTC start hour; overrides the rate
  #   projects:                           # (Optional) Map of OpenAI projects keyed by a logical name. Default: {}
  #     my-project:                       # Logical key used to identify the project (not the OpenAI project ID)
  #       project_id: "proj_xxx"          # (Required) The OpenAI project ID
  #       service_accounts:               # (Optional) Map of service account configurations keyed by logical name. Default: {}
  #         <key>:
  #           name_prefix: "myapp"        # (Optional) Name prefix; final name = name_prefix + "-" + system_name
  #           name: "fixed-name"          # (Optional) Fixed name for the service account (mutually exclusive with name_prefix)
  #           role: "member"              # (Optional) Project role for the service account. Valid values: "member", "owner". Default: "member"
  #           scopes:                     # (Optional) Project-key scopes. Without rotation: provider bootstrap; with rotation: Lambda-created keys. Default: null
  #             - "api.model.request"     #            With rotation, later scope changes update TFCONFIG without replacing the account
  #           expires_in_seconds: 3456000 # (Optional) Rotating project key TTL in seconds; required with cron
  #           secret:                     # (Optional) AWS Secrets Manager configuration for storing the API key. Default: {}
  #             name_prefix: "myapp"      # (Optional) Secret name prefix; final name = name_prefix + "-" + system_name
  #             name: "fixed-secret"      # (Optional) Fixed secret name (mutually exclusive with secret.name_prefix)
  #             path: "/custom/path"      # (Optional) Secret path prefix. Default: /<org_unit>/<env_name>/<env_type>/<project_key>
  #             plain: false              # (Optional, deprecated) Must be false; credentials always use structured JSON
  #             description: "..."        # (Optional) Human-readable description for the Secrets Manager secret
  #             rotation_enabled: true     # (Optional) Enroll when rotation_lambda is set. Default: true; false opts out (not recommended)
  #   admin_keys:                         # (Optional) Map of org-level admin API keys keyed by logical name. Default: {}
  #     <key>:
  #       name_prefix: "admin"            # (Optional) Name prefix; final name = name_prefix + "-" + system_name
  #       name: "fixed-name"              # (Optional) Fixed name for the admin API key (mutually exclusive with name_prefix)
  #       expires_in_seconds: 3600        # (Optional) Relative TTL in seconds, 1-31536000. At most one expiry field. Default: null
  #       expire_in_hours: 24             # (Optional) Relative TTL in hours; must resolve to 1-31536000 whole seconds. Default: null
  #       expire_in_days: 90              # (Optional) Relative TTL in days; must resolve to 1-31536000 whole seconds. Default: null
  #       secret:                         # (Optional) AWS Secrets Manager configuration for storing the API key. Default: {}
  #         name_prefix: "admin"          # (Optional) Secret name prefix; final name = name_prefix + "-" + system_name
  #         name: "fixed-secret"          # (Optional) Fixed secret name (mutually exclusive with secret.name_prefix)
  #         path: "/custom/path"          # (Optional) Full admin secret parent path. Default: /<org_unit>/<env_name>/<env_type>/admin
  #         plain: false                  # (Optional, deprecated) Must be false; credentials always use structured JSON
  #         description: "..."            # (Optional) Human-readable description for the Secrets Manager secret
  #         rotation_enabled: true         # (Optional) Enroll when rotation_lambda is set. Default: true; false opts out (not recommended)
  settings: {}
  ```

  A filled-in example:

  ```yaml
  settings:
    rotation_lambda: "rotate-openai-management" # Existing Lambda function name or ARN
    rotation_period_days: 30             # Shared interval for every enrolled key
    projects:
      # Logical key — not the OpenAI project ID.
      backend-services:
        project_id: "proj_abc123"
        service_accounts:
          # Name derived from name_prefix + "-" + system_name.
          # Secret stores the six-field structured credential JSON.
          api-worker:
            name_prefix: "backend-worker"
            role: "member"
            scopes:
              - "api.model.request"
            secret:
              name_prefix: "backend-worker-openai"
              description: "OpenAI API key for the backend worker service account"
              # path defaults to /<org_unit>/<env_name>/<env_type>/backend-services

          # Fixed name, project owner; opt out only if rotation is unsuitable.
          legacy-integration:
            name: "legacy-integration-sa"
            role: "owner"
            secret:
              name: "legacy-integration-openai-key"
              rotation_enabled: false # Not recommended; Terraform owns this key

      ml-experiments:
        project_id: "proj_xyz789"
        service_accounts:
          trainer:
            name_prefix: "ml-trainer"
            secret:
              name_prefix: "ml-trainer-openai"
              path: "/acme/ml/secrets"    # (Optional) custom path

    admin_keys:
      # Org-level admin key that expires 90 days after creation.
      ci-pipeline:
        name_prefix: "ci-admin"
        expire_in_days: 90
        secret:
          name_prefix: "ci-admin-openai"
          description: "CI pipeline org-level admin key"

      # Non-expiring admin key, still stored as structured JSON.
      ops-break-glass:
        name: "ops-break-glass"
        secret:
          name: "ops-break-glass-openai-admin"
  ```

  ### 3. Generated `terragrunt.hcl`

  Scaffold renders the `terragrunt.hcl` below. It loads `inputs.yaml` as `local.local_vars`,
  merges the tag hierarchy, and generates the `openai` provider block from the `openai`
  settings found in `global-inputs.yaml`. Do not hand-author this file — regenerate it with
  scaffold.

  ```hcl
  locals {
    local_vars  = yamldecode(file("./inputs.yaml"))
    spoke_vars  = yamldecode(file(find_in_parent_folders("spoke-inputs.yaml")))
    region_vars = yamldecode(file(find_in_parent_folders("region-inputs.yaml")))
    env_vars    = yamldecode(file(find_in_parent_folders("env-inputs.yaml")))
    global_vars = yamldecode(file(find_in_parent_folders("global-inputs.yaml")))

    local_tags  = jsondecode(file("./local-tags.json"))
    spoke_tags  = jsondecode(file(find_in_parent_folders("spoke-tags.json")))
    region_tags = jsondecode(file(find_in_parent_folders("region-tags.json")))
    env_tags    = jsondecode(file(find_in_parent_folders("env-tags.json")))
    global_tags = jsondecode(file(find_in_parent_folders("global-tags.json")))

    openai_secret_name         = local.global_vars.openai.secrets.name
    openai_secret_region       = local.global_vars.openai.secrets.region
    openai_secret_sts_role_arn = local.global_vars.openai.secrets.sts_role_arn
    openai_secret_sts_endpoint = local.global_vars.openai.secrets.sts_endpoint
    openai_organization_id     = local.global_vars.openai.organization_id
    openai_secret_api_key      = local.global_vars.openai.secrets.secret_key

    tags = merge(
      local.global_tags,
      local.env_tags,
      local.region_tags,
      local.spoke_tags,
      local.local_tags
    )
  }

  include "root" {
    path = find_in_parent_folders("root.hcl")
  }

  generate "provider-openai" {
    path      = "provider-openai.g.tf"
    if_exists = "overwrite_terragrunt"
    contents  = <<EOF
  provider "openai" {
    organization_id = "${local.openai_organization_id}"
    aws_secrets_manager = {
      region    = "${local.openai_secret_region}"
      secret_id = "${local.openai_secret_name}"
      role_arn  = "${local.openai_secret_sts_role_arn}"
      json_key  = "${local.openai_secret_api_key}"
    }
  }
  EOF
  }

  terraform {
    source = "git::https://github.com/cloudopsworks/terraform-module-openai-mgmt-api-keys.git//?ref=v2.0.0"
  }

  inputs = {
    is_hub     = false
    org        = local.env_vars.org
    spoke_def  = local.spoke_vars.spoke
    settings   = try(local.local_vars.settings, {})
    extra_tags = local.tags
  }
  ```

  ### Variable reference

  | Variable | Type | Required | Description |
  |----------|------|----------|-------------|
  | `org.organization_name` | `string` | yes | Organization name used in tagging |
  | `org.organization_unit` | `string` | yes | Org unit; forms the first segment of the default secret path |
  | `org.environment_type` | `string` | yes | Environment type (e.g. `production`, `staging`) |
  | `org.environment_name` | `string` | yes | Short environment name (e.g. `prod`, `stg`) |
  | `spoke_def` | `string` | no | Three-digit spoke ID. Default: `"001"` |
  | `is_hub` | `bool` | no | Hub or spoke configuration. Default: `false` |
  | `extra_tags` | `map(string)` | no | Additional tags merged onto all resources. Default: `{}` |
  | `settings.rotation_lambda` | `string` | no | Module-wide Lambda function name or ARN. Default: `null` (rotation disabled) |
  | `settings.rotation_period_days` | `number` | no | Whole-day rate interval, 1-999; 1000 retains legacy scheduling without a custom window. Default: `30` |
  | `settings.rotation_window_hours` | `number` | no | Window length in whole hours, 1-23. Default: `null` (AWS default) |
  | `settings.rotation_cron_expression` | `string` | no | AWS cron with minute zero and one numeric UTC hour; overrides the rate interval |
  | `settings.projects` | `map(object)` | no | Map of OpenAI projects keyed by logical name. Default: `{}` |
  | `settings.admin_keys` | `map(object)` | no | Map of org-level admin API keys keyed by logical name. Default: `{}` |

  `org`, `spoke_def`, `is_hub` and `extra_tags` are supplied automatically by the Terragrunt
  hierarchy — only `settings` belongs in `inputs.yaml`.

  #### `settings.projects.<key>`

  | Attribute | Type | Required | Description |
  |-----------|------|----------|-------------|
  | `project_id` | `string` | **yes** | The OpenAI project ID (e.g. `proj_abc123`) |
  | `service_accounts` | `map(object)` | no | Service accounts to create in this project. Default: `{}` |

  #### `settings.projects.<key>.service_accounts.<key>`

  | Attribute | Type | Required | Description |
  |-----------|------|----------|-------------|
  | `name_prefix` | `string` | no* | Name prefix; composed as `name_prefix-<system_name>` |
  | `name` | `string` | no* | Fixed verbatim name for the service account |
  | `role` | `string` | no | Project role. Possible values: `member`, `owner`. Default: `member` |
  | `scopes` | `set(string)` | no | Project-key scopes (e.g. `api.model.request`). Without rotation, changes replace the account; with rotation, `TFCONFIG` changes but the account remains. Default: `null` (provider default) |
  | `expires_in_seconds` | `number` | no | Rotating project key TTL, 1–31536000 seconds. Required with cron; otherwise defaults to a derived finite TTL |
  | `secret.name_prefix` | `string` | no | Secret name prefix; falls back to service account naming |
  | `secret.name` | `string` | no | Fixed verbatim secret name |
  | `secret.path` | `string` | no | Secret path prefix. Default: `/<org_unit>/<env_name>/<env_type>/<project_key>` |
  | `secret.plain` | `bool` | no | Deprecated: must be `false`; JSON is mandatory. Default: `false` |
  | `secret.description` | `string` | no | Human-readable description for the Secrets Manager secret |
  | `secret.rotation_enabled` | `bool` | no | Enroll when the module-wide Lambda is set. Default: `true`; `false` opts out (not recommended) |

  \* One of `name_prefix` or `name` must be provided.

  #### `settings.admin_keys.<key>`

  | Attribute | Type | Required | Description |
  |-----------|------|----------|-------------|
  | `name_prefix` | `string` | no* | Name prefix; composed as `name_prefix-<system_name>` |
  | `name` | `string` | no* | Fixed verbatim name for the admin key |
  | `expires_in_seconds` | `number` | no† | Relative TTL in seconds. Default: unset (non-expiring) |
  | `expire_in_hours` | `number` | no† | Relative TTL in hours. Default: unset (non-expiring) |
  | `expire_in_days` | `number` | no† | Relative TTL in days. Default: unset (non-expiring) |
  | `secret.name_prefix` | `string` | no | Secret name prefix; falls back to admin key naming |
  | `secret.name` | `string` | no | Fixed verbatim secret name |
  | `secret.path` | `string` | no | Full admin secret parent path. Default: `/<org_unit>/<env_name>/<env_type>/admin` |
  | `secret.plain` | `bool` | no | Deprecated: must be `false`; JSON is mandatory. Default: `false` |
  | `secret.description` | `string` | no | Human-readable description for the Secrets Manager secret |
  | `secret.rotation_enabled` | `bool` | no | Enroll when the module-wide Lambda is set. Default: `true`; `false` opts out (not recommended) |

  \* One of `name_prefix` or `name` must be provided.
  † At most one expiry attribute may be set; it must resolve to 1-31,536,000 whole seconds.

  ### Outputs

  | Output | Description |
  |--------|-------------|
  | `service_account_ids` | OpenAI service account IDs keyed by `<project_key>/<service_account_key>` |
  | `service_account_api_key_ids` | Terraform-owned nonrotating service-account key IDs only |
  | `service_account_bootstrap_api_key_ids` | Deprecated compatibility output; null for new rotating accounts, possibly historical IDs in migrated state |
  | `secret_arns` | Secrets Manager ARNs holding service account API keys |
  | `secret_names` | Secrets Manager names holding service account API keys |
  | `admin_key_ids` | Terraform-owned nonrotating admin key IDs only |
  | `rotation_secret_arns` | Project service-account secret ARNs enrolled in rotation; use for Lambda IAM scoping |
  | `rotation_config_version_ids` | Project `TFCONFIG` version IDs |
  | `admin_rotation_secret_arns` | Admin secret ARNs enrolled in rotation; use for Lambda IAM scoping |
  | `admin_rotation_config_version_ids` | Admin `TFCONFIG` version IDs |
  | `admin_secret_arns` | Secrets Manager ARNs holding admin API keys |
  | `admin_secret_names` | Secrets Manager names holding admin API keys |

  No output exposes an API key value — keys are readable only from Secrets Manager.

# Example usage
examples: |-
  ### Minimal — single project, one service account

  ```yaml
  # inputs.yaml
  settings:
    projects:
      my-project:
        project_id: "proj_abc123"
        service_accounts:
          default:
            name_prefix: "myapp"
  ```

  With `org.organization_unit = platform`, `org.environment_name = prod` and
  `org.environment_type = production`, the service account is named `myapp-<system_name>`
  and its API key is stored at
  `/platform/prod/production/my-project/myapp-<system_name>` as structured JSON
  with `key_type`, `api_key`, `api_key_id`, `name`, `project_id`, and `service_account_id`.

  ---

  ### Scoped service account key

  ```yaml
  # inputs.yaml
  settings:
    projects:
      inference:
        project_id: "proj_abc123"
        service_accounts:
          model-caller:
            name_prefix: "inference"
            role: "member"
            scopes:
              - "api.model.request"
            secret:
              name_prefix: "inference-openai"
  ```

  Without rotation, editing `scopes` replaces the service account, its key, and
  its stored secret version. With rotation, the account is retained and the new
  scopes are written to `TFCONFIG` for the Lambda's next key creation.

  ---

  ### Admin key with relative expiry

  ```yaml
  # inputs.yaml
  settings:
    admin_keys:
      terraform-provisioner:
        name_prefix: "tf-provisioner"
        expire_in_days: 90       # at most one of expires_in_seconds / expire_in_hours / expire_in_days
        secret:
          name_prefix: "tf-provisioner-openai"
          description: "Terraform provisioning admin key, rotated quarterly"
  ```

  Omit all three expiry attributes for a non-expiring key. Without rotation,
  changing the expiry replaces the key and stored version; with rotation it
  changes `TFCONFIG` for future Lambda-created keys.

  ---

  ### Lambda-agent prompt

  Copy this brief into the separate rotation-Lambda project:

  > Build an AWS Secrets Manager rotation Lambda for the Cloud Ops Works OpenAI
  > management API-key module. The Terraform module owns AWS secret containers,
  > an initial `TFBOOTSTRAP` version, `TFCONFIG`, the rotation schedule,
  > and project service-account identities. Your Lambda owns every enrolled
  > OpenAI key, including the first, and all usable `AWSPENDING`/`AWSCURRENT`
  > versions. Never modify `TFCONFIG` or `TFBOOTSTRAP`, and never recreate or
  > delete the service-account identity during ordinary key rotation.
  >
  > Use an **independent** OpenAI admin management credential, not the target
  > secret's key. Bind it to the intended OpenAI organization in Lambda
  > deployment configuration and verify that boundary; `TFCONFIG` has no
  > organization ID and a secret name is not proof of organization identity.
  > Implement Secrets Manager `createSecret`, `setSecret`,
  > `testSecret`, and `finishSecret` using the event `SecretId` and
  > `ClientRequestToken`; verify secret identity, rotation enrollment, token
  > stages, and allowed ARN scope before changing anything. Read the exact
  > `TFCONFIG` version by staging label and require `schema_version = 1`. It
  > contains `key_type`, `name`, `project_id`, `service_account_id`, `scopes`,
  > `role`, and `expires_in_seconds`. Snapshot its VersionId and values for
  > each token. Retry a temporarily missing `TFCONFIG`; do not use defaults.
  > `key_type = "admin"` has null project/service-account IDs, scopes, and role;
  > `key_type = "project"` has real IDs and role, with null expiry. Preserve
  > explicit empty scopes separately from null; an empty scope list is **not**
  > no access. Validate the account's project/role context before creation.
  >
  > For admin keys, call `POST /organization/admin_api_keys` with `name` and
  > optional relative `expires_in_seconds`. For project service-account keys,
  > call the service-account API-key create endpoint for the configured
  > `project_id` and `service_account_id` with configured name/scopes. Do not create
  > a new service account. OpenAI returns the plaintext key only on Create;
  > capture its actual value and ID immediately. Keep an independently
  > auditable mapping from each new key to the Secrets Manager token for
  > orphan reconciliation.
  >
  > Every usable credential version must include `key_type`, `api_key`,
  > `api_key_id`, `name`, `project_id`, and `service_account_id`. For a new
  > admin secret, the **only** first-create marker is the pair `api_key = null`
  > and `api_key_id = "__CREATE_NEW__"`; reject malformed markers. A new project
  > secret has those two values plus `key_type = "project"`, name, project ID,
  > and service-account ID; it has no key to retire. Legacy project bootstrap
  > secrets may contain a real provider-created key, which must be retired only
  > after a replacement is tested and promoted. Existing
  > deployments may have a legacy active payload; migration must normalize
  > it before enabling rotation. Never treat bootstrap metadata held in
  > Terraform state as the current key after rotation.
  >
  > Write the candidate as `AWSPENDING` under ClientRequestToken, test it
  > without revealing it, promote it to `AWSCURRENT`, and only then delete the
  > predecessor using the admin-key or project-key delete API as appropriate.
  > Repeated steps must reuse an existing pending version, not create another
  > OpenAI key. Persist enough predecessor/config-version information to make
  > finish/cleanup retryable after promotion. Define an explicit reconciliation
  > policy for a crash after OpenAI Create but before AWS pending write;
  > perfect cross-service exactly-once behavior cannot be assumed. Handle
  > first admin/project creation, legacy project bootstrap retirement, ordinary rotation,
  > changed `TFCONFIG`, missing stage, duplicate events, expiration, identity
  > replacement, and decommissioning in tests.

  Implementation references: [OpenAI admin-key creation](https://developers.openai.com/api/reference/resources/admin/subresources/organization/subresources/admin_api_keys/methods/create),
  [OpenAI service-account key creation](https://developers.openai.com/api/reference/resources/admin/subresources/organization/subresources/projects/subresources/service_accounts/subresources/api_keys/methods/create),
  and [AWS Secrets Manager rotation Lambda steps](https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_lambda-functions.html).

# How to get started quickly
quickstart: |-
  1. Make credentials available to both providers:

     - **AWS** — standard credential chain (IAM role, environment variables, SSO, etc.),
       used for Secrets Manager and tagging.
     - **OpenAI** — the `cloudopsworks/openai` provider resolves its admin key, in order of
       precedence, from the `admin_api_key` argument, the `OPENAI_ADMIN_KEY` environment
       variable, or one cloud secret source (`aws_secrets_manager`, `gcp_secret_manager`
       or `azure_key_vault` — mutually exclusive).

     The scaffolded `terragrunt.hcl` generates the provider block from `global-inputs.yaml`
     using the AWS Secrets Manager source:

     ```yaml
     # global-inputs.yaml
     openai:
       organization_id: "org-xxxxxxxx"    # (Required) OpenAI organization ID
       secrets:
         name: "openai/admin"             # (Required) Secrets Manager secret ID or ARN holding the admin key
         region: "us-east-1"              # (Required) Region of the secret
         sts_role_arn: "arn:aws:iam::111122223333:role/openai-secrets-reader"  # (Required) Role assumed before reading
         sts_endpoint: ""                 # (Optional) Custom STS endpoint
         secret_key: "admin_api_key"      # (Required) JSON key inside the secret payload holding the admin key
     ```

  2. Scaffold the deployment directory (see [Usage](#usage)) or reference the module directly:

     ```hcl
     terraform {
       source = "git::https://github.com/cloudopsworks/terraform-module-openai-mgmt-api-keys.git//?ref=v2.0.0"
     }
     ```

  3. Fill `inputs.yaml` with at minimum one entry under `settings.projects` or
     `settings.admin_keys`.

  4. Run:

     ```sh
     terragrunt init
     terragrunt plan
     terragrunt apply
     ```

  5. Retrieve a stored API key from Secrets Manager:

     ```sh
     aws secretsmanager get-secret-value \
       --secret-id "$(terragrunt output -json secret_names | jq -r 'to_entries[0].value')"
     ```

